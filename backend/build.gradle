java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(24)
    }
}

configurations {
    mockitoAgent {
        transitive = false
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'

    compileOnly 'org.projectlombok:lombok:1.18.40'
    annotationProcessor 'org.projectlombok:lombok:1.18.40'
    implementation 'de.mkammerer:argon2-jvm:2.1'
    implementation 'jakarta.validation:jakarta.validation-api:3.1.1'
    //testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.20.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    //database
    implementation 'org.postgresql:postgresql:42.7.8'
    implementation 'org.locationtech.jts:jts-core:1.20.0'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.hibernate.orm:hibernate-spatial:6.4.0.Final'
    implementation 'org.postgresql:postgresql:42.7.2'
    implementation 'org.n52.jackson:jackson-datatype-jts:2.0.0'
    implementation 'org.locationtech.jts:jts-io:1.20.0'
    implementation 'org.locationtech.jts.io:jts-io-common:1.20.0'


    //mapper
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'


    implementation 'org.flywaydb:flyway-core:11.13.2'
    implementation 'org.flywaydb:flyway-database-postgresql:11.13.2'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis:3.5.6'
}



//compileJava.dependsOn tasks.openApiGenerate

tasks.named('test', Test) {
    useJUnitPlatform()

    testLogging {
        events "passed", "skipped", "failed", "standardError"
        exceptionFormat "full"
        showExceptions true
        showCauses true
        showStackTraces true
        showStandardStreams = true
    }
}
