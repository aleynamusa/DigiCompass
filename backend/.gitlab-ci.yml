sonarcloud-analysis:
  stage: sonar
  variables:
    SONAR_USER_HOME: "C:/sonar_cache"
    GIT_DEPTH: "0"
  tags:
    - backend
  script:
    - echo "Running SonarCloud analysis..."
    - 'echo "Token length: $($SONAR_TOKEN.Length)"'
    - cd backend
    - ./gradlew test integrationTest jacocoTestReport --no-daemon
    - ./gradlew sonar "-Dsonar.token=$env:SONAR_TOKEN" --no-daemon
  only:
    - main
    - development
  allow_failure: true


docker-backend:build-and-push:
  stage: deploy
  image: docker:26.1.3
  tags:
    - backend
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - echo "Building Docker backend image..."
    - docker build -t $DOCKERHUB_USERNAME/digicompass-backend:latest -t $DOCKERHUB_USERNAME/digicompass-backend:$CI_COMMIT_SHORT_SHA backend
    - echo "Pushing backend image to Docker Hub..."
    - docker push $DOCKERHUB_USERNAME/digicompass-backend:latest
    - docker push $DOCKERHUB_USERNAME/digicompass-backend:$CI_COMMIT_SHORT_SHA
  only:
    - main