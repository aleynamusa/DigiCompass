stages:
  - build
  - test

build-job:
  stage: build
  script:
    - echo "Compiling the project..."
    - mkdir build
    - echo "Build successful!" > build/output.txt
  artifacts:
    paths:
      - build/

test-job:
  stage: test
  script:
    - echo "Running tests..."
    - cat build/output.txt
    - echo "All tests passed!"
