# GitLab CI/CD Pipeline for Java Spring Boot Application with Docker

# Define pipeline stages
stages:
  - build
  - test
  - package
  - deploy

# Global variables
variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  APP_NAME: "java-backend-app"
  DOCKER_IMAGE_NAME: "$CI_REGISTRY_IMAGE"

# Cache Maven dependencies
cache:
  paths:
    - .m2/repository
    - target/

# ============================================
# BUILD STAGE
# ============================================

backend:build:
  stage: build
  image: gradle:8.3-jdk24
  script:
    - echo "Building Spring Boot backend..."
    - ./gradlew clean bootJar --no-daemon
  artifacts:
    paths:
      - backend/build/libs/*.jar
    expire_in: 1 hour
  only:
    - main
    - develop    

# ============================================
# TEST STAGE
# ============================================

unit-tests:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - echo "Running unit tests with Mockito..."
    - mvn $MAVEN_CLI_OPTS test
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    when: always
    paths:
      - target/surefire-reports/
      - target/site/jacoco/
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
  only:
    - main
    - develop
    - merge_requests

integration-tests:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  services:
    - postgres:15
    - redis:7-alpine
  variables:
    POSTGRES_DB: testdb
    POSTGRES_USER: testuser
    POSTGRES_PASSWORD: testpassword
    POSTGRES_HOST_AUTH_METHOD: trust
    SPRING_PROFILES_ACTIVE: test
  script:
    - echo "Running integration tests..."
    - mvn $MAVEN_CLI_OPTS verify -Dskip.unit.tests=true
  artifacts:
    when: always
    paths:
      - target/failsafe-reports/
    reports:
      junit:
        - target/failsafe-reports/TEST-*.xml
  only:
    - main
    - develop
    - merge_requests

code-quality:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - echo "Running code quality checks..."
    - mvn $MAVEN_CLI_OPTS checkstyle:check
    - mvn $MAVEN_CLI_OPTS pmd:check
  allow_failure: true
  artifacts:
    paths:
      - target/checkstyle-result.xml
      - target/pmd.xml
    expire_in: 1 week
  only:
    - merge_requests

security-scan:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - echo "Running dependency security check..."
    - mvn $MAVEN_CLI_OPTS dependency-check:check || true
  artifacts:
    paths:
      - target/dependency-check-report.html
    expire_in: 1 week
  allow_failure: true
  only:
    - main
    - develop
    - merge_requests

# ============================================
# PACKAGE STAGE
# ============================================

package:jar:
  stage: package
  image: maven:3.9-eclipse-temurin-17
  script:
    - echo "Building JAR package..."
    - mvn $MAVEN_CLI_OPTS package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 day
  only:
    - main
    - develop
  needs:
    - unit-tests
    - integration-tests

docker:build:
  stage: package
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building Docker image..."
    - docker build -t $DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA .
    - docker build -t $DOCKER_IMAGE_NAME:latest .
    - echo "Pushing Docker image to registry..."
    - docker push $DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA
    - docker push $DOCKER_IMAGE_NAME:latest
  only:
    - main
    - develop
  needs:
    - package:jar

docker:scan:
  stage: package
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - apk add --no-cache curl
    - |
      curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
  script:
    - docker pull $DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA
    - trivy image --severity HIGH,CRITICAL --exit-code 0 $DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA
  allow_failure: true
  only:
    - main
    - develop
  needs:
    - docker:build

# ============================================
# DEPLOY STAGE
# ============================================

deploy:staging:
  stage: deploy
  image: docker:24
  environment:
    name: staging
    url: https://staging.example.com
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $STAGING_SERVER >> ~/.ssh/known_hosts
  script:
    - echo "Deploying to staging environment..."
    - |
      ssh $STAGING_USER@$STAGING_SERVER << EOF
        cd /opt/app
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
        docker pull $DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA
        docker-compose down
        docker tag $DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA $APP_NAME:latest
        docker-compose up -d
        docker system prune -af
      EOF
  only:
    - develop
  when: manual
  needs:
    - docker:build

deploy:production:
  stage: deploy
  image: docker:24
  environment:
    name: production
    url: https://example.com
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $PROD_SERVER >> ~/.ssh/known_hosts
  script:
    - echo "Deploying to production environment..."
    - |
      ssh $PROD_USER@$PROD_SERVER << EOF
        cd /opt/app
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
        docker pull $DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA
        docker-compose down
        docker tag $DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA $APP_NAME:latest
        docker-compose up -d
        docker system prune -af
      EOF
  only:
    - main
  when: manual
  needs:
    - docker:build
    - docker:scan

# ============================================
# ROLLBACK (Optional)
# ============================================

rollback:production:
  stage: deploy
  image: docker:24
  environment:
    name: production
    url: https://example.com
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $PROD_SERVER >> ~/.ssh/known_hosts
  script:
    - echo "Rolling back production deployment..."
    - |
      ssh $PROD_USER@$PROD_SERVER << EOF
        cd /opt/app
        docker-compose down
        docker pull $DOCKER_IMAGE_NAME:$ROLLBACK_TAG
        docker tag $DOCKER_IMAGE_NAME:$ROLLBACK_TAG $APP_NAME:latest
        docker-compose up -d
      EOF
  only:
    - main
  when: manual