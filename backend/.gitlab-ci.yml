stages:
  - main
  - test

build-job:
  stage: main
  script:
    - echo "Compiling the project..."
    - mkdir main
    - echo "Build successful!" > main/output.txt
  artifacts:
    paths:
      - main/

test-job:
  stage: test
  script:
    - echo "Running tests..."
    - Get-Content main/output.txt
    - echo "All tests passed!"
