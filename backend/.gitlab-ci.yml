stages:
  - build
  - test

build-job:
  stage: build
  script:
    - echo "Compiling the project..."
    - New-Item -ItemType Directory -Force -Path main
    - echo "Build successful!" | Out-File -FilePath main/output.txt -Encoding UTF8
    - echo "Build complete"
  artifacts:
    paths:
      - main/
    expire_in: 1 hour
  tags:
    - shell

test-job:
  stage: test
  dependencies:
    - build-job
  script:
    - echo "Running tests..."
    - if (Test-Path main/output.txt) { Get-Content main/output.txt } else { Write-Error "Build artifact not found"; exit 1 }
    - echo "All tests passed!"
  tags:
    - shell

# Disable SAST if you don't need it
sast:
  stage: .pre
  script:
    - echo "SAST disabled"
  rules:
    - when: never