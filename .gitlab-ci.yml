integration-tests:
  stage: test
  image: gradle:8.3-jdk24
  script:
    - docker compose -f docker-compose.test.yml up -d
    - cd backend
    - ./gradlew integrationTest --no-daemon
  artifacts:
    when: always
    reports:
      junit: backend/build/test-results/integrationTest/TEST-*.xml
    paths:
      - backend/build/reports/tests/integrationTest



e2e:
  stage: test
  image: node:latest
  services:
    - name: docker:26.1.3
      alias: docker
  variables:
    CYPRESS_baseUrl: "http://localhost:5173"
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "Running tests with Cypress..."
    - docker compose -f docker-compose.yml up -d --build
    - cd frontend
    - npm install
    - npx cypress run
  artifacts:
    when: always
    paths:
      - frontend/cypress/videos
      - frontend/cypress/screenshots



docker:build-and-push:
  stage: deploy
  image: docker:26.1.3
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - echo "Building Docker images..."

    # Build backend
    - docker build -t $DOCKERHUB_USERNAME/digicompass-backend:latest -t $DOCKERHUB_USERNAME/digicompass-backend:$CI_COMMIT_SHORT_SHA backend

    # Build frontend
    - docker build -t $DOCKERHUB_USERNAME/digicompass-frontend:latest -t $DOCKERHUB_USERNAME/digicompass-frontend:$CI_COMMIT_SHORT_SHA frontend

    - echo "Pushing images to Docker Hub..."

    - docker push $DOCKERHUB_USERNAME/digicompass-backend:latest
    - docker push $DOCKERHUB_USERNAME/digicompass-backend:$CI_COMMIT_SHORT_SHA

    - docker push $DOCKERHUB_USERNAME/digicompass-frontend:latest
    - docker push $DOCKERHUB_USERNAME/digicompass-frontend:$CI_COMMIT_SHORT_SHA
  only:
    - main
