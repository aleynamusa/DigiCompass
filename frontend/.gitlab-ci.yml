stages:
  - build
  - test
  - deploy

frontend:build:
  stage: build
  image: docker:stable
  services:
    - docker:dind
  tags:
    - frontend
  script:
    - echo "Building Vite + React frontend..."
    - docker build -t frontend-app -f frontend/Dockerfile frontend


e2e:
  stage: test
  image: docker:26.1.3
  tags:
    - frontend
  services:
    - docker:26.1.3-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    CYPRESS_baseUrl: "http://localhost:5173"
  script:
    - echo "Starting E2E stack..."
    - docker compose -f docker-compose-test.yml up -d --build

    - cd frontend
    - npm install
    - npx cypress run --browser chrome --headless
    - cd ..
    - docker compose -f docker-compose-test.yml down

  artifacts:
    when: always
    paths:
      - frontend/cypress/videos
      - frontend/cypress/screenshots

  only:
    - main


docker-frontend:build-and-push:
  stage: deploy
  image: docker:26.1.3
  tags:
    - frontend
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - echo "Building Docker frontend images..."

    - docker build -t $DOCKERHUB_USERNAME/digicompass-frontend:latest -t $DOCKERHUB_USERNAME/digicompass-frontend:$CI_COMMIT_SHORT_SHA frontend

    - echo "Pushing frontend image to Docker Hub..."

    - docker push $DOCKERHUB_USERNAME/digicompass-frontend:latest
    - docker push $DOCKERHUB_USERNAME/digicompass-frontend:$CI_COMMIT_SHORT_SHA
  only:
    - main



deploy-frontend:
  stage: deploy
  image: alpine:latest
  tags:
    - frontend
  before_script:
    - apk add --no-cache openssh-client
  script:
    - echo "$EC2_SSH_PRIVATE_KEY" > deploy_key.pem
    - chmod 600 deploy_key.pem
    - ssh -o StrictHostKeyChecking=no -i deploy_key.pem ec2-user@<your-ec2-ip> "
      docker pull $DOCKERHUB_USERNAME/digicompass-frontend:latest &&
      docker stop frontend || true &&
      docker rm frontend || true &&
      docker run -d -p 5173:5173 --name frontend $DOCKERHUB_USERNAME/digicompass-frontend:latest
      "
  only:
    - main