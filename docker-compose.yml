services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    environment:
      SPRING_DATA_MONGODB_URI: "mongodb://mongo:27017/digicompass"
    ports:
      - "8080:8080"
    depends_on:
      - mongo
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - app-network

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data: