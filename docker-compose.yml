version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    ports:
      - "8080:8080"
    depends_on:
      - postgresql
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network


  postgresql:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres.mfhwglyfwlceqwmcuucr
      POSTGRES_PASSWORD: z/pGBiv*Wj.W24$
      POSTGRES_DB: digicompass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
