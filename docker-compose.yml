services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "5005:5005" #debugging
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/digicompass
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: dbyT56@
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      SPRING_FLYWAY_URL: jdbc:postgresql://db:5432/digicompass
      SPRING_FLYWAY_USER: postgres
      SPRING_FLYWAY_PASSWORD: dbyT56@

      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
      JWT_SECRET: YkXaexcUDueBfriBeEkEBhyGY7w5dWvaHzPn3FLrhUA=
    depends_on:
      - db
      - redis
    networks:
      - app-network

  db:
    image: postgis/postgis:17-3.5
    restart: always
    environment:
      POSTGRES_DB: digicompass
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dbyT56@
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
